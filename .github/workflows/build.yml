name: Build libvosk and Python wheels

# Builds libvosk and the Python wheel from THIS repository's sources for every platform, so that
# they all run the same Vosk version. Pushing a tag vX.Y.Z also publishes everything as a GitHub
# release and refreshes the pip index on GitHub Pages.
on:
  workflow_dispatch:
    inputs:
      ios_slices:
        description: 'iOS slices to build (device, simulator)'
        default: 'device simulator'
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - 'travis/**'
      - 'ios/**'
      - 'python/**'
      - 'src/**'
      - 'android/lib/build-vosk.sh'
      - '.github/workflows/build.yml'

jobs:
  linux:
    name: Linux ${{ matrix.name }} (manylinux_2_28 wheel)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64
            script: ./build-docker.sh
          - name: x86_64-mkl
            script: ./build-docker-mkl.sh
    steps:
      - uses: actions/checkout@v4
      - name: Build libvosk and the wheel
        working-directory: travis
        run: ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: vosk-linux-${{ matrix.name }}
          path: wheelhouse/

  linux-cross:
    name: Linux ${{ matrix.name }} (cross-build)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: aarch64
            dockerfile: Dockerfile.dockcross-manylinux
            image: dockcross/manylinux_2_28-aarch64
            openblas: TARGET=ARMV8
          - name: armv7
            dockerfile: Dockerfile.dockcross
            image: dockcross/linux-armv7a
            openblas: TARGET=ARMV7
          - name: armv7-musl
            dockerfile: Dockerfile.dockcross-musl
            image: dockcross/linux-armv7l-musl
            openblas: TARGET=ARMV7
          - name: x86
            dockerfile: Dockerfile.dockcross
            image: dockcross/linux-x86
            openblas: TARGET=CORE2 DYNAMIC_ARCH=1
          - name: riscv64
            dockerfile: Dockerfile.dockcross
            image: dockcross/linux-riscv64
            openblas: TARGET=RISCV64_GENERIC ARCH=riscv64
    steps:
      - uses: actions/checkout@v4
      - name: Build libvosk and the wheel
        run: |
          docker build --build-arg "DOCKCROSS_IMAGE=${{ matrix.image }}" \
            --build-arg "OPENBLAS_ARGS=${{ matrix.openblas }}" \
            --file travis/${{ matrix.dockerfile }} --tag kaldi-cross travis
          docker run --rm -v "$PWD":/io kaldi-cross /io/travis/build-wheels-dockcross.sh
      - uses: actions/upload-artifact@v4
        with:
          name: vosk-linux-${{ matrix.name }}
          path: wheelhouse/

  windows:
    name: Windows ${{ matrix.name }} (MinGW cross-build)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x64
            script: ./build-docker-win.sh
          - name: x86
            script: ./build-docker-win32.sh
          - name: arm64
            script: ./build-docker-winaarch64.sh
    steps:
      - uses: actions/checkout@v4
      - name: Build libvosk.dll and the wheel
        working-directory: travis
        run: ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: vosk-windows-${{ matrix.name }}
          path: wheelhouse/

  android:
    name: Android (libvosk.so, every ABI)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update -qq && sudo apt-get install -y autoconf automake libtool cmake
      - name: Build libvosk.so for armeabi-v7a, arm64-v8a, x86_64 and x86
        working-directory: android/lib
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          ./build-vosk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: vosk-android
          path: android/lib/src/main/jniLibs/*/libvosk.so

  ios:
    name: iOS (libvosk.xcframework, device + simulator)
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: brew install autoconf automake libtool
      - name: Build libvosk.xcframework
        env:
          SLICES: ${{ inputs.ios_slices || 'device simulator' }}
        run: ios/build_libvosk.sh build/ios-libvosk
      - name: Show xcframework content
        run: |
          plutil -p build/ios-libvosk/libvosk.xcframework/Info.plist
          find build/ios-libvosk/libvosk.xcframework -name '*.dylib' -exec lipo -info {} \; -exec ls -lh {} \;
      - name: Smoke test in the iOS Simulator
        run: ios/test/smoke_test.sh build/ios-libvosk/libvosk.xcframework
      - uses: actions/upload-artifact@v4
        with:
          name: libvosk-ios-xcframework
          path: build/ios-libvosk/libvosk.xcframework

  macos:
    name: macOS (universal2 libvosk.dylib + wheel)
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build tools
        run: |
          brew install autoconf automake libtool
          pip install wheel cffi requests tqdm srt websockets
      - name: Build libvosk.dylib (arm64 + x86_64)
        env:
          SLICES: macos-arm64 macos-x86_64
        run: ios/build_libvosk.sh build/macos
      - name: Build the wheel
        run: |
          cp build/macos/macos/libvosk.dylib src/
          python -m pip wheel ./python --no-deps --no-build-isolation -w wheelhouse
          mkdir -p wheelhouse/vosk-macos-universal2
          cp build/macos/macos/libvosk.dylib build/macos/macos/vosk_api.h wheelhouse/vosk-macos-universal2/
      - name: Smoke test the wheel
        run: travis/smoke_test_wheel.sh wheelhouse/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: vosk-macos-universal2
          path: wheelhouse/

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, linux-cross, windows, android, ios, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Package the release assets
        run: travis/package-release.sh artifacts assets
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true

  # pip index listing the wheels of every release (Settings > Pages > Source: GitHub Actions)
  pages:
    name: pip index (GitHub Pages)
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the index
        env:
          GH_TOKEN: ${{ github.token }}
        run: travis/build_pip_index.py "$GITHUB_REPOSITORY" site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
