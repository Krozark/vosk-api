name: Build libvosk for iOS

# Compiles Kaldi + libvosk (static, Accelerate) for iOS device and simulator
# and publishes libvosk.xcframework as an artifact.
on:
  workflow_dispatch:
    inputs:
      slices:
        description: 'Slices to build (device, simulator)'
        default: 'device simulator'
  push:
    paths:
      - 'ios/build_libvosk.sh'
      - 'ios/libvosk_static.mk'
      - '.github/workflows/ios.yml'

jobs:
  libvosk-ios:
    name: Build libvosk.xcframework
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: brew install autoconf automake libtool

      - name: Build libvosk.xcframework
        env:
          SLICES: ${{ inputs.slices || 'device simulator' }}
        run: ios/build_libvosk.sh build/ios-libvosk

      - name: Show xcframework content
        run: |
          plutil -p build/ios-libvosk/libvosk.xcframework/Info.plist
          find build/ios-libvosk/libvosk.xcframework -name '*.a' -exec lipo -info {} \; -exec ls -lh {} \;

      - uses: actions/upload-artifact@v4
        with:
          name: libvosk-ios-xcframework
          path: build/ios-libvosk/libvosk.xcframework
